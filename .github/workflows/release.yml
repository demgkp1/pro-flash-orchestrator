name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (optional, e.g. v0.7.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Package and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run public test gates
        run: |
          node scripts/doctor.mjs
          node scripts/test-concurrency.mjs
          node scripts/test-regressions.mjs
          node scripts/test-v060.mjs
          node scripts/test-capabilities.mjs
          node scripts/test-install.mjs
          node scripts/test-codex.mjs
          node scripts/test-update.mjs

      - name: Package platform release archives
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            node scripts/package.mjs --runtime --platform antigravity --out-dir dist --tag "$RELEASE_TAG"
            node scripts/package.mjs --runtime --platform codex --out-dir dist --tag "$RELEASE_TAG"
          else
            node scripts/package.mjs --runtime --platform antigravity --out-dir dist
            node scripts/package.mjs --runtime --platform codex --out-dir dist
          fi

      - name: Verify platform archive layouts
        run: |
          ANTIGRAVITY_ARCHIVE=$(find dist -maxdepth 1 -type f -name 'pro-flash-orchestrator-antigravity-v*.zip')
          CODEX_ARCHIVE=$(find dist -maxdepth 1 -type f -name 'pro-flash-orchestrator-codex-v*.zip')
          test "$(printf '%s\n' "$ANTIGRAVITY_ARCHIVE" | grep -c .)" -eq 1
          test "$(printf '%s\n' "$CODEX_ARCHIVE" | grep -c .)" -eq 1
          unzip -l "$ANTIGRAVITY_ARCHIVE"
          unzip -l "$CODEX_ARCHIVE"
          BAD_ANTIGRAVITY=$(unzip -Z1 "$ANTIGRAVITY_ARCHIVE" | grep -v '^pro-flash-orchestrator/' || true)
          BAD_CODEX=$(unzip -Z1 "$CODEX_ARCHIVE" | grep -v '^pro-flash-orchestrator-codex/' || true)
          if [ -n "$BAD_ANTIGRAVITY" ] || [ -n "$BAD_CODEX" ]; then
            echo "Error: archive entry escaped its platform root"
            printf '%s\n%s\n' "$BAD_ANTIGRAVITY" "$BAD_CODEX"
            exit 1
          fi
          echo "Verified both platform roots; package.mjs already enforced each exact runtime allowlist."

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_FILE="docs/releases/$GITHUB_REF_NAME.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
            if [ -f "$NOTES_FILE" ]; then
              gh release edit "$GITHUB_REF_NAME" --title "pro-flash-orchestrator-$GITHUB_REF_NAME" --notes-file "$NOTES_FILE"
            fi
          elif [ -f "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --title "pro-flash-orchestrator-$GITHUB_REF_NAME" --notes-file "$NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --title "pro-flash-orchestrator-$GITHUB_REF_NAME" --generate-notes
          fi
